[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "l1ght5p33d"
version = "0.2.0"
description = "Local, deterministic creation workflows with verified outcomes and AI-assisted repair"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{name = "L1ght5p33d contributors"}]
dependencies = [
  "openadapt-flow==1.34.0",
  "playwright==1.62.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "mido==1.3.3",
  "mcp==2.1.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "cryptography==50.0.1",
  "pywinauto==0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-timeout==2.4.0", "ruff==0.16.5",
  "mypy==2.3.1", "build==1.6.0", "pip-audit==2.10.1",
  "pip-licenses==5.5.5", "hypothesis==6.151.9",
]

[project.scripts]
l1ght5p33d = "l1ght5p33d.__main__:main"

[project.urls]
Homepage = "https://github.com/HiTecHelpLLC/l1ght5p33d"
Issues = "https://github.com/HiTecHelpLLC/l1ght5p33d/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/l1ght5p33d"]

[tool.hatch.build.targets.sdist]
include = ["src/l1ght5p33d", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 90
markers = ["windows: requires an interactive Windows desktop", "browser: local Chromium fixture"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/l1ght5p33d"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
